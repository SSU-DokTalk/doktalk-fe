server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    root /usr/share/nginx/html;

    # JS·CSS·SVG·JSON을 압축해서 보내요 (woff2 글꼴은 이미 압축돼 있어요).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 빌드 파일은 이름에 내용 해시가 붙어서 1년 동안 캐시해요.
    # 없는 파일(예전 배포의 페이지 조각)은 index.html 대신 404를 돌려줘요.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 새 배포가 바로 보이도록 index.html은 매번 새로 확인해요.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api {
        # API 응답은 지금처럼 압축하지 않아요 (위 설정은 프런트 빌드 파일용).
        gzip off;
        rewrite ^/api(.*)$ $1?$args break;
        proxy_pass   http://doktalk-be:8000;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
